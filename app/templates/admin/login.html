{% extends "base.html" %}
{% block title %}Admin login · {{ store_name }}{% endblock %}
{% block content %}
<h1>Admin login</h1>
{% if error %}<p class="warning">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login" class="login-form">
  <label for="captcha_answer">Captcha
    <span class="muted">(type the result of the calculation shown)</span>
  </label>
  <img src="/captcha.svg?token={{ captcha_token }}" alt="captcha challenge"
       width="170" height="56" class="captcha-img">
  <input type="hidden" name="captcha_token" value="{{ captcha_token }}">
  <input type="text" id="captcha_answer" name="captcha_answer"
         autocomplete="off" required maxlength="8" inputmode="numeric"
         class="captcha-input">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="off" required>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
