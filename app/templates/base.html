<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}{{ store_name }}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="js-banner" role="alert">
    JavaScript is enabled in this browser. For maximum privacy, disable it —
    NodeMarket works fully without JavaScript.
  </div>
  <noscript><style>.js-banner{display:none !important;}</style></noscript>

  <header class="site-header">
    <a class="brand" href="/"><img src="/static/logo.png" alt="" width="22" height="22" class="brand-logo">{{ store_name }}</a>
    <nav>
      <a href="/">Catalog</a>
      <a href="/cart">Cart</a>
      <a href="/admin" rel="nofollow">Admin</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Powered by <a href="https://github.com/spekofc/NodeMarket" target="_blank" rel="noopener noreferrer">NodeMarket</a></p>
    <p class="muted">No JavaScript. No tracking. No analytics.</p>
  </footer>
</body>
</html>
